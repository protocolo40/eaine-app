function prescreverForca(repsBase, semanaIdx, fatorMes){
  const p = PROGRESSAO_SEMANA[semanaIdx];
  const reps = Math.max(6, Math.round(repsBase*p.repsMult*(fatorMes<0.8?1.15:1)));
  const sets = fatorMes<0.8 ? Math.max(2,p.sets-1) : p.sets;
  return `${sets} x ${reps}`;
}

}

  // desencontra em 6 pra que o dia de perna nao repita o mesmo abdomen/lombar do dia de braco
  const pick6 = (arr)=>arr[(mesIdx+6) % arr.length];
  const corePost = [ pick6(PADRAO_ABDOMEN), pick6(PADRAO_LOMBAR), pick(PADRAO_ALONGAMENTO_INF) ];
  const ehTempo = (nome)=>/along|mobilidade|respira|prancha|hold|isometr|ponte|bird dog|hollow/i.test(nome);
  const semanas = [0,1,2,3].map(w=>{
    const p = PROGRESSAO_SEMANA[w];
    const pct = pctCarga(w, fatorMes);
    const selo = `sem ${w+1}/4 - ${p.rot} - alvo ~${pct}% da carga de referencia - descanso ${p.descanso}`;
    const presTempo = (nome, repsBase)=> ehTempo(nome)
      ? (/along|mobilidade|respira/i.test(nome) ? `${Math.round(25*p.tempoMult)}s cada lado` : `${p.sets} x ${Math.round(32*p.tempoMult)}s`)
      : prescreverForca(repsBase, w, fatorMes);
    return {
      semana:w+1, rotulo:p.rot, pctCarga:pct, descanso:p.descanso,
      superior: sup.map(([nome,nota])=>({id:uid(), nome, nota:`${nota} (${selo})`, pres:prescreverForca(12,w,fatorMes), tempo:""})),
      superiorCore: coreSup.map(([nome,nota])=>({id:uid(), nome, nota, pres:presTempo(nome,14), tempo:""})),
      posterior: post.map(([nome,nota])=>({id:uid(), nome, nota:`${nota} (${selo})`, pres:prescreverForca(13,w,fatorMes), tempo:""})),
      posteriorCore: corePost.map(([nome,nota])=>({id:uid(), nome, nota, pres:presTempo(nome,14), tempo:""})),
    };
  });
  return {mes:mesIdx+1, blocoNome:`Bloco ${mesIdx+1} - exercicios novos`, semanas};
}

function ajustarBloco(min){ return `${Math.max(3,Math.round(min))} min`; }
function gerarCardioSemana(mesIdx, semanaIdx){
  const fator = FATORES_MES[mesIdx]*RAMP_SEMANA[semanaIdx];
  const rot = `semana ${semanaIdx+1}/4 · mês ${mesIdx+1}`;
  // modalidades trocam por mês
  const [modA, dicaA] = MODALIDADES_CONTINUO[mesIdx % MODALIDADES_CONTINUO.length];
  const [modB, dicaB] = MODALIDADES_CONTINUO[(mesIdx+3) % MODALIDADES_CONTINUO.length];
  const formato = FORMATOS_INTERVALADO[mesIdx % FORMATOS_INTERVALADO.length];

  // SEG — contínuo de base
  const totSeg = Math.max(30, Math.round(60*fator/5)*5);
  const kcalSeg = Math.max(160, Math.round(430*fator/5)*5);
  const rpeSeg = fator>=1.08 ? "6" : fator>=1.0 ? "5-6" : "4-5";
  const fcSeg  = fator>=1.08 ? "70-78%" : fator>=1.0 ? "65-75%" : "60-70%";

  // QUA — intervalado (rounds e descanso evoluem com o fator)
  const rounds = Math.max(5, Math.round(12*fator));
  const descanso = Math.max(20, Math.round(60/fator/5)*5);
  const totQua = Math.max(30, Math.round(60*fator/5)*5);
  const kcalQua = Math.max(180, Math.round(520*fator/5)*5);

  // SEX — contínuo longo
  const totSex = Math.max(30, Math.round(60*fator/5)*5);
  const kcalSex = Math.max(170, Math.round(470*fator/5)*5);

  return {
    semana: semanaIdx+1,
    SEG:{ sistema:"Contínuo · base aeróbica", nome:`${modA} em ritmo constante`, duracao:`${totSeg} min`,
      kcalNum:kcalSeg, kcalTxt:`${kcalSeg-30}-${kcalSeg+30} kcal`,
      carga:`Ritmo que ainda dá pra soltar frase curta — ${dicaA}. (${rot})`,
      blocos:[
        {id:uid(), fase:"Aquecimento progressivo", duracao:ajustarBloco(totSeg*0.14), rpe:"3", fc:"55-65%"},
        {id:uid(), fase:`Corpo principal · ${modA} contínuo`, duracao:ajustarBloco(totSeg*0.76), rpe:rpeSeg, fc:fcSeg},
        {id:uid(), fase:"Volta à calma", duracao:ajustarBloco(totSeg*0.10), rpe:"2", fc:"<55%"},
      ]},
    QUA:{ sistema:`Intervalado · ${formato.nome}`, nome:`${formato.nome} — estímulo forte da semana`, duracao:`${totQua} min`,
      kcalNum:kcalQua, kcalTxt:`${kcalQua-40}-${kcalQua+40} kcal`,
      carga:`Esforço forte nas estações, técnica intacta do primeiro ao último round. (${rot})`,
      blocos:[
        {id:uid(), fase:"Aquecimento + mobilidade específica", duracao:ajustarBloco(totQua*0.16), rpe:"3-4", fc:"—"},
        {id:uid(), fase:formato.montar(rounds, descanso), duracao:ajustarBloco(totQua*0.68), rpe:fator>=1.08?"9":"8-9", fc:"—"},
        {id:uid(), fase:"Volta à calma + alongamento", duracao:ajustarBloco(totQua*0.16), rpe:"2", fc:"—"},
      ]},
    SEX:{ sistema:"Contínuo · longo moderado", nome:`${modB} — volume da semana`, duracao:`${totSex} min`,
      kcalNum:kcalSex, kcalTxt:`${kcalSex-30}-${kcalSex+30} kcal`,
      carga:`Ritmo moderado sustentado — ${dicaB}. Constrói base sem destruir o fim de semana. (${rot})`,
      blocos:[
        {id:uid(), fase:"Aquecimento progressivo", duracao:ajustarBloco(totSex*0.14), rpe:"3", fc:"55-65%"},
        {id:uid(), fase:`Corpo principal · ${modB}`, duracao:ajustarBloco(totSex*0.76), rpe:rpeSeg, fc:fcSeg},
        {id:uid(), fase:"Volta à calma", duracao:ajustarBloco(totSex*0.10), rpe:"2", fc:"<55%"},
      ]},
  };
}

function mesAtual(cfg){
  if(!cfg || !cfg.inicioPrograma) return null;
  const ini = new Date(cfg.inicioPrograma+"T00:00:00");
  const hoje = new Date(hojeStr()+"T00:00:00");
  let diffMeses = (hoje.getFullYear()-ini.getFullYear())*12 + (hoje.getMonth()-ini.getMonth());
  if(hoje.getDate()<ini.getDate()) diffMeses -= 1;
  if(diffMeses<0) diffMeses = 0;
  const idx = diffMeses % 12;
  return { ...cfg.mesociclos[idx], mesDoAno: diffMeses+1 };
}
function semanaAtual(cfg){
  if(!cfg || !cfg.inicioPrograma) return 1;
  const ini = new Date(cfg.inicioPrograma+"T00:00:00");
  const hoje = new Date(hojeStr()+"T00:00:00");
  const dias = Math.max(0, Math.round((hoje-ini)/864e5));
  return (Math.floor(dias/7) % 4) + 1;
}

function faseCiclo(cfg){
  if(!cfg || !cfg.ultimaMenstruacao) return null;
  const dur = Number(cfg.duracaoCiclo)||28, durM = Number(cfg.duracaoMenstruacao)||5;
  const ini = new Date(cfg.ultimaMenstruacao+"T00:00:00");
  const hoje = new Date(hojeStr()+"T00:00:00");
  const diff = Math.floor((hoje-ini)/864e5);
  if(diff<0) return null;
  const diaCiclo = (diff % dur) + 1;
  const ovulacao = dur - 14;
  if(diaCiclo <= durM) return {chave:"menstrual", dia:diaCiclo};
  if(diaCiclo >= ovulacao-1 && diaCiclo <= ovulacao+1) return {chave:"ovulatoria", dia:diaCiclo};
  if(diaCiclo < ovulacao-1) return {chave:"folicular", dia:diaCiclo};
  return {chave:"lutea", dia:diaCiclo};
}
function projetarSemanas(pesoAtual, metaKg, taxa){
  let p = pesoAtual; const alvo = pesoAtual - metaKg; let semanas = 0; const marcos = [];
  while(p > alvo && semanas < 60){ p = p - p*(taxa/100); semanas++; if(semanas%4===0) marcos.push({semana:semanas, peso:Math.round(p*10)/10}); }
  return { semanas, marcos, pesoFinal: Math.round(p*10)/10 };
}

/* ========= HOOKS de armazenamento ========= */
function useDoc(db, path, seed){
  const [data,setData] = useState(seed);
  const [ready,setReady] = useState(!db);
  useEffect(()=>{
    if(!db) return;
    const ref = db.doc(path);
    let seeded = false;
    const unsub = ref.onSnapshot(
      (snap)=>{
        if(snap.exists){ setData(snap.data()); setReady(true); }
        else if(!seeded){ seeded = true; ref.set(seed).catch(()=>{}); }
      },
      ()=>{ setData(seed); setReady(true); }
    );
    return ()=>unsub();
  }, [db, path]);
  const save = (next)=>{ setData(next); if(db){ db.doc(path).set(next).catch(()=>{}); } };
  return [data, save, ready];
}
function useCollection(db, path, orderField, dir, lim){
  const [items,setItems] = useState([]);
  useEffect(()=>{
    if(!db) return;
    let q = db.collection(path);
    if(orderField) q = q.orderBy(orderField, dir||"asc");
    if(lim) q = q.limit(lim);
    const unsub = q.onSnapshot(
      (snap)=>{ setItems(snap.docs.map(d=>({id:d.id, ...d.data()}))); },
      ()=>{}
    );
    return ()=>unsub();
  }, [db, path]);
  return items;
}

/* Lista de exercícios editável — modo leitura vira Linha, modo edição vira inputs */
function ListaExercicios({items, onSave, editMode, cargasPorExercicio, onLog}){
  const upd = (idx, field, val)=>{ const n=[...items]; n[idx]={...n[idx],[field]:val}; onSave(n); };
  const remove = (idx)=>{ const n=items.filter((_,i)=>i!==idx); onSave(n); };
  const add = ()=> onSave([...items,{id:uid(),nome:"Novo exercício",nota:"",pres:"",tempo:""}]);
  if(!editMode){
    return <>{items.map((e,i)=>{
      const log = cargasPorExercicio && cargasPorExercicio[e.nome];
      const ultimoLog = log && log.length ? log[log.length-1] : null;
      return <Linha key={e.id||i} i={i} nome={e.nome} nota={e.nota} pres={e.pres} tempo={e.tempo}
        onLog={onLog} ultimoLog={ultimoLog}/>;
    })}</>;
  }
  return (
    <div>
      {items.map((e,i)=>(
        <div key={e.id||i} style={{padding:"12px 0",borderTop:i?`1px solid ${T.rule}`:"none"}}>
          <div style={{display:"flex",gap:10,alignItems:"center"}}>
            <input style={{...inputStyle,fontSize:14,color:T.text}} value={e.nome} onChange={ev=>upd(i,"nome",ev.target.value)} placeholder="Nome do exercício"/>
            <input style={{...inputGold,width:100,flexShrink:0}} value={e.pres} onChange={ev=>upd(i,"pres",ev.target.value)} placeholder="séries × reps"/>
            <input style={{...inputStyle,width:70,flexShrink:0}} value={e.tempo||""} onChange={ev=>upd(i,"tempo",ev.target.value)} placeholder="tempo"/>
            <button onClick={()=>remove(i)} style={{background:"transparent",border:"none",color:T.stop,cursor:"pointer",fontSize:16,padding:"0 4px"}}>×</button>
          </div>
          <textarea style={{...inputStyle,marginTop:8,minHeight:36,resize:"vertical"}} value={e.nota} onChange={ev=>upd(i,"nota",ev.target.value)} placeholder="Observação de execução"/>
        </div>
      ))}
      <button onClick={add} style={{marginTop:10,background:"transparent",border:`1px dashed ${T.goldDim}`,color:T.gold,cursor:"pointer",
        fontFamily:DISPLAY,fontSize:11,letterSpacing:".14em",textTransform:"uppercase",padding:"9px 14px",width:"100%"}}>+ Adicionar exercício</button>
    </div>
  );
}

                    <div>
                      <div style={{fontFamily:DISPLAY,fontWeight:300,fontSize:22,color:T.text,lineHeight:1}}>{avaliacoes.length}</div>
                      <Eyebrow style={{marginTop:7}}>Treinos avaliados</Eyebrow>
                    </div>
                  </div>
                  {avaliacoes.slice(-8).reverse().map(s=>(
                    <div key={s.id} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderTop:`1px solid ${T.rule}`,fontSize:12.5}}>
                      <span style={{color:T.text}}>{s.id} · {s.dia||""}</span>
                      <span style={{color:s.avaliacao<=2?T.warn:T.gold,fontFamily:DISPLAY}}>{s.avaliacao}/5</span>
                    </div>
                  ))}
                  <div style={{fontSize:11,color:T.mute,marginTop:12,lineHeight:1.5}}>Nota 1 ou 2 é sinal pra trocar o estímulo no mês seguinte.</div>
                </>
              )}
            </Panel>

            <div style={{height:18}}/>
            <SecHead idx="03" titulo="Evolução de cargas"/>
            <Panel>
              {Object.keys(cargasPorExercicio).length===0 ? (
                <div style={{fontSize:13,color:T.mute,lineHeight:1.6}}>Nenhuma carga registrada ainda — lance na aba Força.</div>
              ) : Object.keys(cargasPorExercicio).map((nome,i)=>{
                const arr = cargasPorExercicio[nome];
                const first = arr[0], last = arr[arr.length-1];
                const pct = (typeof first.carga==="number" && typeof last.carga==="number" && first.carga>0) ? Math.round(((last.carga-first.carga)/first.carga)*100) : null;
                return (
                  <div key={nome} style={{padding:"13px 0",borderTop:i?`1px solid ${T.rule}`:"none"}}>
                    <div style={{fontSize:14,color:T.text,fontWeight:500}}>{nome}</div>
                    <div style={{display:"flex",gap:24,marginTop:8,flexWrap:"wrap"}}>
                      <div><Eyebrow>Início · {first.data}</Eyebrow><div style={{fontFamily:DISPLAY,fontSize:15,color:T.soft,marginTop:4}}>{first.carga} kg</div></div>
                      <div><Eyebrow>Atual · {last.data}</Eyebrow><div style={{fontFamily:DISPLAY,fontSize:15,color:T.soft,marginTop:4}}>{last.carga} kg</div></div>
                      {pct!=null && <div><Eyebrow>Evolução</Eyebrow><div style={{fontFamily:DISPLAY,fontSize:15,marginTop:4,color:pct>=0?T.ok:T.stop}}>{pct>0?"+":""}{pct}%</div></div>}
                    </div>
                  </div>
                );
              })}
            </Panel>

            <div style={{height:18}}/>
            <SecHead idx="04" titulo="Avaliação ISAKmetry" meta="14/09/2026"/>
            <Panel>
              {[
                ["IMC","30,7 kg/m²","Obesidade grau 1 (18,5-24,9 é a faixa saudável)"],
                ["Massa gorda","21,3 kg · 28,47%",""],
                ["Massa muscular","26,71 kg","Score-Z 3,05 — bem acima da média"],
                ["Cintura","87 cm",""], ["Quadril","104,5 cm",""],
                ["Razão cintura/quadril","0,83","Baixo risco cardiovascular"],
                ["Razão cintura-estatura","0,56","Acima de 0,50 — indicador de atenção"],
              ].map((r,i)=>(
                <div key={i} style={{padding:"13px 0",borderTop:i?`1px solid ${T.rule}`:"none"}}>
                  <div style={{display:"flex",justifyContent:"space-between",gap:10}}>
                    <div style={{fontSize:14,color:T.text,fontWeight:500}}>{r[0]}</div>
                    <div style={{fontFamily:DISPLAY,fontSize:14,color:T.gold,whiteSpace:"nowrap"}}>{r[1]}</div>
                  </div>
                  {r[2] && <div style={{fontSize:12,color:T.mute,marginTop:4,lineHeight:1.5}}>{r[2]}</div>}
                </div>
              ))}
            </Panel>
          </section>
        )}

        {tab==="testes" && (
          <section>
            <SecHead idx="01" titulo="Avaliação de capacidades físicas" right={<EditToggle on={editMode} setOn={setEditMode}/>}/>
            <div style={{fontSize:13,color:T.mute,lineHeight:1.6,marginBottom:18}}>
              Banco de testes por competência — equilíbrio, coordenação, força, lateralidade específica e outras que o coach adicionar. Cada teste guarda protocolo e histórico de resultados.
            </div>
            {testesBank.categorias.map((cat,ci)=>{
              const updCat=(field,val)=>{ const n=[...testesBank.categorias]; n[ci]={...n[ci],[field]:val}; saveTestesBank({categorias:n}); };
              const addTeste=()=> updCat("testes",[...cat.testes,{id:uid(),nome:"Novo teste",protocolo:"",unidade:""}]);
              const updTeste=(ti,field,val)=>{ const ts=[...cat.testes]; ts[ti]={...ts[ti],[field]:val}; updCat("testes",ts); };
              const remTeste=(ti)=> updCat("testes", cat.testes.filter((_,i)=>i!==ti));
              return (
                <div key={cat.id} style={{marginBottom:18}}>
                  <div style={{display:"flex",alignItems:"baseline",gap:10,marginBottom:8}}>
                    {editMode ? (
                      <input style={{...inputStyle,fontFamily:DISPLAY,fontSize:16,color:T.gold,letterSpacing:".06em",textTransform:"uppercase"}} value={cat.nome} onChange={e=>updCat("nome",e.target.value)}/>
                    ) : <H size={16} color={T.gold}>{cat.nome}</H>}
                    <div style={{flex:1,height:1,background:T.rule}}/>
                  </div>
                  <Panel>
                    {cat.testes.map((te,ti)=>{
                      const resultados = testesResultados.filter(r=>r.testeId===te.id);
                      return (
                        <div key={te.id} style={{padding:"14px 0",borderTop:ti?`1px solid ${T.rule}`:"none"}}>
                          {editMode ? (
                            <div>
                              <div style={{display:"flex",gap:10}}>
                                <input style={{...inputStyle}} value={te.nome} onChange={e=>updTeste(ti,"nome",e.target.value)} placeholder="Nome do teste"/>
                                <input style={{...inputStyle,width:90}} value={te.unidade} onChange={e=>updTeste(ti,"unidade",e.target.value)} placeholder="unidade"/>
                                <button onClick={()=>remTeste(ti)} style={{background:"transparent",border:"none",color:T.stop,cursor:"pointer",fontSize:16}}>×</button>
                              </div>
                              <textarea style={{...inputStyle,marginTop:8,minHeight:44}} value={te.protocolo} onChange={e=>updTeste(ti,"protocolo",e.target.value)} placeholder="Protocolo do teste"/>
                            </div>
                          ) : (
                            <>
                              <div style={{fontSize:14.5,color:T.text,fontWeight:500}}>{te.nome}</div>
                              {te.protocolo && <div style={{fontSize:12.5,color:T.mute,marginTop:6,lineHeight:1.55}}>{te.protocolo}</div>}
                            </>
                          )}
                          <RegistroTeste db={db} categoriaId={cat.id} categoriaNome={cat.nome} teste={te} autor={autor} hoje={hoje} resultados={resultados}/>
                        </div>
                      );
                    })}
                    {editMode && (
                      <button onClick={addTeste} style={{marginTop:10,background:"transparent",border:`1px dashed ${T.goldDim}`,color:T.gold,cursor:"pointer",
                        fontFamily:DISPLAY,fontSize:11,letterSpacing:".14em",textTransform:"uppercase",padding:"9px 14px",width:"100%"}}>+ Adicionar teste em {cat.nome}</button>
                    )}
                  </Panel>
                </div>
              );
            })}
            {editMode && (
              <button onClick={()=>saveTestesBank({categorias:[...testesBank.categorias,{id:uid(),nome:"Nova competência",testes:[]}]})}
                style={{width:"100%",background:"transparent",border:`1px dashed ${T.gold}`,color:T.gold,cursor:"pointer",
                fontFamily:DISPLAY,fontSize:11.5,letterSpacing:".18em",textTransform:"uppercase",padding:"12px"}}>+ Adicionar competência</button>
            )}
          </section>
        )}

        <div style={{height:30}}/>
      </div>

      <nav style={{position:"fixed",bottom:0,left:0,right:0,background:"#030303",borderTop:`1px solid ${T.rule}`,display:"flex",padding:"0 4px 10px",zIndex:30}}>
        {NAV.map(([k,l])=>(
          <button key={k} onClick={()=>setTab(k)}
            style={{flex:1,background:"transparent",border:"none",cursor:"pointer",padding:"12px 1px 6px",
                    borderTop:`2px solid ${tab===k?T.gold:"transparent"}`,marginTop:-1,
                    fontFamily:DISPLAY,fontSize:9,letterSpacing:".04em",textTransform:"uppercase",
                    color:tab===k?T.gold:T.mute}}>
            {l}
          </button>
        ))}
      </nav>
    </div>
  );
}

function RegistroTeste({db, categoriaId, categoriaNome, teste, autor, hoje, resultados}){
  const [valor,setValor] = useState("");
  const [obs,setObs] = useState("");
  const salvar = ()=>{
    if(!valor || !db) return;
    db.collection("testes_resultados").add({
      data:hoje, categoriaId, categoriaNome, testeId:teste.id, testeNome:teste.nome,
      resultado:valor, unidade:teste.unidade, obs, autor
    }).catch(()=>{});
    setValor(""); setObs("");
  };
  return (
    <div style={{marginTop:10,paddingLeft:12,borderLeft:`1px solid ${T.ruleGold}`}}>
      <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
        <div>
          <Eyebrow>Resultado{teste.unidade?` (${teste.unidade})`:""}</Eyebrow>
          <input style={{...inputGold,width:100}} value={valor} onChange={e=>setValor(e.target.value)}/>
        </div>
        <div style={{flex:1,minWidth:140}}>
          <Eyebrow>Obs.</Eyebrow>
          <input style={{...inputStyle}} value={obs} onChange={e=>setObs(e.target.value)}/>
        </div>
        <button onClick={salvar} style={{background:"transparent",border:`1px solid ${T.goldDim}`,color:T.gold,cursor:"pointer",
          fontFamily:DISPLAY,fontSize:10.5,letterSpacing:".14em",textTransform:"uppercase",padding:"9px 14px"}}>Salvar</button>
      </div>
      {resultados.length>0 && (
        <div style={{marginTop:10}}>
          {resultados.slice(0,4).map(r=>(
            <div key={r.id} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",fontSize:12,color:T.mute}}>
              <span>{r.data} · {r.autor}</span>
              <span style={{color:T.soft}}>{r.resultado}{r.unidade?` ${r.unidade}`:""}{r.obs?` — ${r.obs}`:""}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
} catch(e) {
  document.getElementById('root').innerHTML = '<pre style="color:#fff;background:#900;padding:16px;font-size:12px;white-space:pre-wrap">ERRO REAL:\n' + (e && e.message) + '\n\n' + (e && e.stack) + '</pre>';
}
</script>
</body>
</html>
